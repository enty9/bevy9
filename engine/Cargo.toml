[workspace]
resolver = "3"
members = [
  "crates/engine_core",
  "crates/engine_protocol",
  "crates/engine_render",
  "crates/engine_scene",
  "crates/engine_runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
doc_markdown = "warn"
manual_let_else = "warn"
unwrap_or_default = "warn"
semicolon_if_nothing_returned = "warn"

[workspace.dependencies]
engine_core = { path = "crates/engine_core" }
engine_protocol = { path = "crates/engine_protocol" }
engine_render = { path = "crates/engine_render" }
engine_scene = { path = "crates/engine_scene" }
engine_runtime = { path = "crates/engine_runtime" }

bevy = { path = "..", default-features = false }
bevy_app = { path = "../crates/bevy_app" }
bevy_asset = { path = "../crates/bevy_asset" }
bevy_camera = { path = "../crates/bevy_camera" }
bevy_color = { path = "../crates/bevy_color", features = ["serialize"] }
bevy_diagnostic = { path = "../crates/bevy_diagnostic" }
bevy_ecs = { path = "../crates/bevy_ecs", features = ["serialize"] }
bevy_gizmos = { path = "../crates/bevy_gizmos" }
bevy_image = { path = "../crates/bevy_image" }
bevy_input = { path = "../crates/bevy_input" }
bevy_light = { path = "../crates/bevy_light" }
bevy_log = { path = "../crates/bevy_log" }
bevy_math = { path = "../crates/bevy_math", features = ["serialize"] }
bevy_mesh = { path = "../crates/bevy_mesh" }
bevy_pbr = { path = "../crates/bevy_pbr" }
bevy_reflect = { path = "../crates/bevy_reflect", features = ["uuid"] }
bevy_remote = { path = "../crates/bevy_remote" }
bevy_render = { path = "../crates/bevy_render" }
bevy_settings = { path = "../crates/bevy_settings" }
bevy_shape = { path = "../crates/bevy_shape", features = ["serialize"] }
bevy_sprite = { path = "../crates/bevy_sprite" }
bevy_sprite_render = { path = "../crates/bevy_sprite_render" }
bevy_state = { path = "../crates/bevy_state" }
bevy_time = { path = "../crates/bevy_time" }
bevy_transform = { path = "../crates/bevy_transform", features = ["serialize"] }
bevy_window = { path = "../crates/bevy_window" }
bevy_world_serialization = { path = "../crates/bevy_world_serialization", features = ["serialize"] }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
uuid = { version = "1.26", features = ["v4", "serde"] }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 1
