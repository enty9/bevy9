[workspace]

[package]
name = "bevy9_editor"
version = "0.1.0"
description = "Bevy9 Engine Tauri v2 desktop editor shell and runtime host supervisor"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
doc_markdown = "warn"
manual_let_else = "warn"
unwrap_or_default = "warn"
semicolon_if_nothing_returned = "warn"

[lib]
name = "bevy9_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
